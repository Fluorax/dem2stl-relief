# relief-map - single source of truth. Every other value is derived from this file.

paths:
  tiles_dir: tiles          # Copernicus GLO-90 tiles (fetch_data.py)
  tiles30_dir: tiles30      # Copernicus GLO-30 tiles, only for regions with `dem: glo30` (fetch_data.py --region)
  trails_dir: trails        # OSM trails per region (fetch_data.py --region)
  fill_dir: fill_tiles      # SRTM 1" - used ONLY to patch flat country islands (DEM gaps like Donousa)
  borders_dir: borders      # geoBoundaries ADM0 (fetch_data.py)
  out_dir: out              # results go to out/full/ or out/<region>/

# Greek Grid (EPSG:2100) projection parameters, but on the WGS84 datum so no datum shift is needed:
# gdalwarp and geopandas then can't pick different transformations (DEM/borders stay aligned).
crs: "+proj=tmerc +lat_0=0 +lon_0=24 +k=0.9996 +x_0=500000 +y_0=0 +ellps=WGS84 +units=m +no_defs"
dem: glo90                                      # glo90 | glo30 (regions can override)
country: GRC                                    # printed in 3D
neighbours: [TUR, ALB, MKD, BGR, MNE, XKX, SRB] # flat plateau; add codes if the preview shows missing land

checks:
  land_threshold_m: 5   # DEM above this counts as land (unclassified-land check, flat-island check, patch)

layout:
  grid: [4, 4]        # [cols, rows] of tiles. Print scale is DERIVED from this to fit the country.
  tile_mm: 220        # tile edge length (fits 220x220 beds and larger)
  margin_mm: 10       # minimum empty space between the country's bbox and the frame edge
  px_mm: 0.2          # print-space pixel size (tile_mm / px_mm must be an integer)

print:
  first_layer_mm: 0.2       # printer is calibrated for a 0.2 mm first layer
  layer_mm: 0.12            # all other layers. Slicer must use exactly these two values
  base_mm: 1.64             # sea thickness; must sit on the layer grid (0.2 + k*0.12) - pipeline checks
  plateau_layers: 2         # neighbours sit this many layers above the sea (0.24 mm)
  land_offset_layers: 7     # country land starts this many layers above the plateau (0.84 mm)

relief:
  # Elevation (m) -> height above the land base (print mm), smooth monotone curve through
  # these points. Steeper segment = more exaggeration there. Last point must be >= the
  # highest elevation it receives (report warns otherwise).
  # This top-level curve is the verified whole-map setting (no local relief).
  curve:
    - [0, 0]
    - [300, 0.6]
    - [1000, 4]
    - [1500, 10]
    - [3000, 28]
  # Optional local relief - see the attica preset below for an example. When present, the
  # curve is applied to the regional base (elevation blurred over blur_km) and the detail
  # (elevation - base) is added on top:
  #   blur_km        what counts as "surroundings"
  #   exaggeration   detail x true scale
  #   deadband_m     detail smaller than this is flattened
  #   smooth_km      low-pass on the detail (removes needle peaks)
  #   cap_mm         soft tanh cap on detail height (rounds big peaks, keeps small hills)
  #   valley_factor  scale for negative detail (<1 keeps valleys from being clipped flat)

mesh:
  max_error_mm: 0.05     # max vertical deviation of the simplified mesh (hmm); < half a layer
  skip_sea_only: true    # don't mesh tiles that are pure sea

colours:
  # Elevations (m) where a new colour starts on country land, converted to layer heights in
  # stl/manifest.json. Empty = only the fixed swaps (sea -> plateau -> country). Undecided.
  bands_m: []

# Print only part of the map: python pipeline.py --region NAME (same for mesh.py).
# A preset needs bbox [lon_min, lat_min, lon_max, lat_max]; the frame is fitted to it.
# Any other top-level key (layout, relief, print, ...) can be overridden per region.
# Optional `focus`: GeoJSON polygon - country land outside it prints flat like a neighbour.
# Bboxes are approximate.
regions:
  peloponnese:
    bbox: [21.05, 36.35, 23.50, 38.40]
    layout:
      grid: [1, 1]

  attica:
    bbox: [23.10, 37.60, 24.15, 38.35]
    layout:
      grid: [1, 1]
    relief:
      # Applied to the regional base, which peaks around 740 m in Attica (report: base_max_m).
      curve:
        - [0, 0]
        - [200, 0.2]
        - [500, 1.2]
        - [1000, 4]
      local:
        blur_km: 3
        exaggeration: 5
        deadband_m: 15
        smooth_km: 0.8
        cap_mm: 3
        valley_factor: 0.3

  # --- Attica tuning variants: same area, different relief. Compare side by side. ---
  attica_linear:            # baseline: plain ~3x exaggeration at this scale, no local relief
    bbox: [23.10, 37.60, 24.15, 38.35]
    layout:
      grid: [1, 1]
    relief:
      curve:
        - [0, 0]
        - [1400, 9]

  attica_mid:               # local relief between the "pins" and the "blobs"
    bbox: [23.10, 37.60, 24.15, 38.35]
    layout:
      grid: [1, 1]
    relief:
      curve:
        - [0, 0]
        - [200, 0.2]
        - [500, 1.2]
        - [1000, 4]
      local:
        blur_km: 3
        exaggeration: 6
        deadband_m: 10
        smooth_km: 0.3
        cap_mm: 5
        valley_factor: 0.6

  attica_bal:               # between the knives (exaggeration 8, uncapped) and the pimples (attica_mid)
    bbox: [23.10, 37.60, 24.15, 38.35]
    layout:
      grid: [1, 1]
    relief:
      curve:                # lifted low end: gives valleys room above the land base
        - [0, 0]
        - [200, 1.0]
        - [500, 2.5]
        - [1000, 5]
      local:
        blur_km: 4
        exaggeration: 7
        deadband_m: 10
        smooth_km: 0.15     # keeps ridges (0.3 rounded them into pimples)
        cap_mm: 8           # peaks up to ~8 mm of detail, then rounded (knives went to 14)
        valley_factor: 0.4

  attica_hybrid:            # attica_linear's detail + attica_mid's flat plains
    bbox: [23.10, 37.60, 24.15, 38.35]
    layout:
      grid: [1, 1]
    relief:
      curve:                # same linear curve as attica_linear (~3x at this scale)
        - [0, 0]
        - [1400, 9]
      local:
        blur_km: 2
        exaggeration: 3.0   # = the curve's slope, so hills come out exactly as in attica_linear
        deadband_m: 25      # the only real change: undulation under +-25 m around the local mean is flattened

  # --- Hiking maps ------------------------------------------------------------------
  # `dem: glo30` for large scales; `trails` presses OSM hiking paths in as grooves.
  xerovouni:                # Xerovouni (Portaris 1,453 m) + Dirfys (1,743 m) + Steni, central Evia. ~20 x 20 km, approximate bbox
    bbox: [23.775, 38.51, 24.005, 38.69]
    dem: glo30
    layout:
      grid: [1, 1]
    relief:
      curve:                # linear; ~1.2x at ~1:100,000 - check vertical_exaggeration_by_segment
        - [0, 0]
        - [1800, 22]
    trails:
      highway: [path, footway, bridleway]   # plus all member ways of route=hiking relations
      hiking_routes: true
      exclude_highway: [motorway, trunk, primary, secondary, tertiary]
      mode: cut             # cut = bench-cut groove | emboss = raised rib
      width_mm: 0.8         # 2 extrusion widths - narrower won't print as a groove
      depth_layers: 2       # 0.24 mm at 0.12 mm layers

  konitsa:                  # Konitsa + Trapezitsa (2,024 m) + Aoos gorge + Tymfi (Gamila 2,497 m). ~25 x 25 km, approximate
    bbox: [20.66, 39.90, 20.96, 40.12]
    # Vikos gorge instead of / as well as Aoos: extend south, e.g. [20.62, 39.86, 20.96, 40.12] (~29 km, ~1:150,000)
    dem: glo30
    layout:
      grid: [1, 1]
    relief:
      curve:                # linear, ~1.1x at ~1:125,000 - check vertical_exaggeration_by_segment
        - [0, 0]
        - [2600, 23]
    trails:
      highway: [path, footway, bridleway]
      hiking_routes: true
      exclude_highway: [motorway, trunk, primary, secondary, tertiary]
      mode: cut
      width_mm: 0.8
      depth_layers: 2

  salamina:                 # Salamina island only (Mavrovouni 404 m). Small and cheap: ~2/3 of the tile is sea
    bbox: [23.37, 37.84, 23.60, 38.00]     # approximate, ~20 x 18 km
    focus_point: [23.50, 37.933]            # keep only the land piece containing this point (the island)
    focus_others: plateau                   # other land (Attica, Megara coast): plateau | sea
    dem: glo30
    layout:
      grid: [1, 1]
      tile_mm: 150
    relief:
      curve:                # linear, ~3x at ~1:155,000 (404 m is only ~2.6 mm at true scale)
        - [0, 0]
        - [450, 8.7]
    trails:
      highway: [path, footway, bridleway]
      hiking_routes: true
      exclude_highway: [motorway, trunk, primary, secondary, tertiary]
      mode: cut
      width_mm: 0.8
      depth_layers: 2
